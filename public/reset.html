<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password — Quick Scheduling</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container narrow">
    <div class="brand">
      <h1>Quick Scheduling</h1>
      <p>Choose a new password</p>
    </div>
    <div class="card">
      <div id="error" class="alert alert-error hidden" role="alert"></div>
      <div id="success" class="alert alert-success hidden" role="status"></div>
      <form id="reset-form" novalidate>
        <label>
          New password
          <span class="hint">At least 8 characters, with a capital letter, a number, and a special character.</span>
          <span class="pw-wrap"><input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" required><button type="button" class="pw-toggle" data-for="newPassword" aria-label="Show password">Show</button></span><span class="pw-meter" aria-hidden="true"><span class="pw-meter-fill" id="newPassword-meter-fill"></span></span><span class="pw-strength" id="newPassword-strength"></span>
        </label>
        <label>
          Confirm new password
          <span class="pw-wrap"><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required><button type="button" class="pw-toggle" data-for="confirmPassword" aria-label="Show password">Show</button></span>
        </label>
        <button type="submit" id="submit">Set new password</button>
      </form>
    </div>
  </div>
  <script>
    (function () {
      var form = document.getElementById('reset-form');
      var errorBox = document.getElementById('error');
      var successBox = document.getElementById('success');
      var submitBtn = document.getElementById('submit');
      var token = new URLSearchParams(window.location.search).get('token');

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
      }

      if (!token) {
        form.classList.add('hidden');
        showError('This reset link is missing its token. Please request a new reset link from the "Forgot password?" page.');
        return;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorBox.textContent = '';
        errorBox.classList.add('hidden');
        var newPassword = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        if (!newPassword || !confirmPassword) {
          showError('Please enter and confirm your new password.');
          return;
        }
        var pwOk = newPassword.length >= 8 && /[A-Z]/.test(newPassword) && /[0-9]/.test(newPassword) && /[^A-Za-z0-9]/.test(newPassword);
        if (!pwOk) {
          showError('Password must be at least 8 characters and include one capital letter, one number, and one special character.');
          return;
        }
        if (newPassword !== confirmPassword) {
          showError('The passwords do not match.');
          return;
        }
        submitBtn.disabled = true;
        fetch('/api/auth/password-reset/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ token: token, newPassword: newPassword })
        }).then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        }).then(function (result) {
          submitBtn.disabled = false;
          if (result.ok) {
            form.classList.add('hidden');
            successBox.textContent = '';
            var link = document.createElement('a');
            link.href = '/login.html';
            link.textContent = 'Log in';
            successBox.appendChild(document.createTextNode('Your password has been reset. '));
            successBox.appendChild(link);
            successBox.appendChild(document.createTextNode(' with your new password.'));
            successBox.classList.remove('hidden');
          } else {
            showError(result.data && result.data.error
              ? result.data.error
              : 'This reset link is invalid or has expired. Please request a new one.');
          }
        }).catch(function () {
          submitBtn.disabled = false;
          showError('Network error. Please check your connection and try again.');
        });
      });
    })();
  
    document.querySelectorAll('.pw-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = document.getElementById(btn.getAttribute('data-for'));
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    });
  
    var pwInput = document.getElementById('newPassword');
    var pwFill = document.getElementById('newPassword-meter-fill');
    var pwLabel = document.getElementById('newPassword-strength');
    if (pwInput && pwFill && pwLabel) {
      pwInput.addEventListener('input', function () {
        var v = pwInput.value;
        if (!v) { pwFill.style.width = '0'; pwLabel.textContent = ''; pwLabel.className = 'pw-strength'; return; }
        var score = 0;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        if (v.length >= 12) score++;
        var pct = Math.round(score / 5 * 100);
        pwFill.style.width = pct + '%';
        if (score <= 2) {
          pwFill.style.backgroundColor = '#dc2626';
          pwLabel.textContent = 'Weak password';
          pwLabel.className = 'pw-strength weak';
        } else if (score <= 3) {
          pwFill.style.backgroundColor = '#d97706';
          pwLabel.textContent = 'Fair — add more character types';
          pwLabel.className = 'pw-strength fair';
        } else {
          pwFill.style.backgroundColor = '#16a34a';
          pwLabel.textContent = 'Strong password';
          pwLabel.className = 'pw-strength strong';
        }
      });
    }
  </script>
</body>
</html>
