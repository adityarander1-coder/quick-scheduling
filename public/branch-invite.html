<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your branch — Quick Scheduling</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #eef3f4; color: #1c2b2e; min-height: 100vh;
  }
  header { background: #083f4d; color: #fff; padding: 26px 20px 30px; text-align: center; }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #9fd8de; }
  header h1 { font-size: 24px; font-weight: 700; margin-top: 10px; }
  header p { margin-top: 7px; font-size: 14px; color: #c8e4e8; }
  main { padding: 26px 16px 40px; }
  .card {
    max-width: 520px; margin: 0 auto; background: #fff; border-radius: 14px;
    box-shadow: 0 6px 24px rgba(8,63,77,.12); padding: 24px 26px 26px;
  }
  label.flabel { display: block; font-size: 13px; font-weight: 600; margin: 17px 0 6px; color: #24444d; }
  label.flabel.first { margin-top: 4px; }
  input[type="text"], input[type="email"], input[type="password"], select {
    width: 100%; padding: 0.52rem 0.65rem; border: 1px solid #c9d8db; border-radius: 8px;
    font-size: 14px; font-family: inherit; color: #1c2b2e; background: #fff;
  }
  input:focus, select:focus { outline: 2px solid #0e7c86; outline-offset: 0; border-color: #0e7c86; }
  input[readonly] { background: #f2f7f8; color: #56707a; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; min-width: 0; }
  .hint { font-size: 12px; color: #6c8891; margin-top: 5px; line-height: 1.4; }
  .submit {
    width: 100%; margin-top: 24px; background: #0e7c86; color: #fff; border: none;
    font-size: 15.5px; font-weight: 700; font-family: inherit; padding: 13px; border-radius: 9px; cursor: pointer;
  }
  .submit:hover { background: #0a6270; }
  .submit:disabled { opacity: .6; cursor: default; }
  .alert-error {
    background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    border-radius: 10px; padding: 0.7rem 0.9rem; font-size: 13.5px; margin-bottom: 14px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="wordmark">Quick Scheduling</div>
  <h1 id="headline">Set up your branch</h1>
  <p id="subline">You've been invited as this branch's first admin.</p>
</header>
<main>
  <div class="card">
    <div id="error" class="alert-error hidden" role="alert"></div>
    <form id="accept-form" novalidate>
      <label class="flabel first" for="f-branch">Branch name</label>
      <input type="text" id="f-branch" readonly>

      <label class="flabel" for="f-name">Your name</label>
      <input type="text" id="f-name" placeholder="Jordan Ellis" autocomplete="name">

      <label class="flabel" for="f-email">Your email</label>
      <input type="email" id="f-email" readonly>

      <label class="flabel" for="f-pass">Create password</label>
      <input type="password" id="f-pass" placeholder="••••••••••" autocomplete="new-password">
      <div class="hint">At least 8 characters, with a capital letter, a number, and a special character.</div>

      <div class="row">
        <div style="flex: 1.5;">
          <label class="flabel" for="f-address">Branch address</label>
          <input type="text" id="f-address" placeholder="1200 Hospital Drive, Monroe, LA" autocomplete="street-address">
        </div>
        <div>
          <label class="flabel" for="f-tz">Timezone</label>
          <select id="f-tz">
            <option value="America/Chicago" selected>Central (Chicago)</option>
            <option value="America/New_York">Eastern (New York)</option>
            <option value="America/Denver">Mountain (Denver)</option>
            <option value="America/Los_Angeles">Pacific (Los Angeles)</option>
            <option value="America/Phoenix">Arizona (Phoenix)</option>
            <option value="Pacific/Honolulu">Hawaii (Honolulu)</option>
            <option value="America/Anchorage">Alaska (Anchorage)</option>
          </select>
        </div>
      </div>

      <button class="submit" type="submit" id="submit">Create branch &amp; sign in</button>
    </form>
  </div>
</main>
<script>
  (function () {
    var token = new URLSearchParams(location.search).get('token') || '';
    var errorBox = document.getElementById('error');
    var submitBtn = document.getElementById('submit');
    var form = document.getElementById('accept-form');
    function showError(msg) { errorBox.textContent = msg; errorBox.classList.remove('hidden'); }
    function val(id) { return document.getElementById(id).value.trim(); }

    if (!token) {
      showError('This invite link is invalid or has expired.');
      submitBtn.disabled = true;
    } else {
      fetch('/api/institutions/branch-invite/info?token=' + encodeURIComponent(token))
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          if (!res.ok) { showError((res.data && res.data.error) || 'This invite link is invalid or has expired.'); submitBtn.disabled = true; return; }
          document.getElementById('f-branch').value = res.data.branchName;
          document.getElementById('f-email').value = res.data.email;
          document.getElementById('headline').textContent = 'Set up ' + res.data.branchName;
          document.getElementById('subline').textContent = res.data.branchName + ' is joining ' + res.data.legalName + ' on Quick Scheduling.';
        })
        .catch(function () { showError('Network error. Please check your connection and try again.'); });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorBox.classList.add('hidden');
      var body = {
        token: token,
        name: val('f-name'),
        password: document.getElementById('f-pass').value,
        address: val('f-address'),
        timezone: document.getElementById('f-tz').value
      };
      if (!body.name || !body.password) { showError('Please enter your name and a password.'); return; }
      submitBtn.disabled = true;
      fetch('/api/institutions/branch-invite/accept', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body)
      }).then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      }).then(function (result) {
        submitBtn.disabled = false;
        if (!result.ok) { showError((result.data && result.data.error) || 'Could not accept the invite. Please try again.'); return; }
        window.location.href = '/app.html';
      }).catch(function () {
        submitBtn.disabled = false;
        showError('Network error. Please check your connection and try again.');
      });
    });
  })();
</script>
</body>
</html>
