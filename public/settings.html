<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — Quick Scheduling</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .settings-card { border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1rem; background: #fff; }
    .settings-card h3 { margin: 0 0 0.8rem; font-size: 1.15rem; }
    .target-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .target-row:last-child { border-bottom: none; }
    .color-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
    .target-name { font-weight: 600; min-width: 140px; flex: 1; }
    .stepper { display: flex; align-items: center; gap: 0.4rem; }
    .stepper button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 1.2rem; font-weight: 700; cursor: pointer; line-height: 1; }
    .stepper button:hover { background: #f0f4f8; }
    .stepper span { min-width: 36px; text-align: center; font-size: 1.2rem; font-weight: 700; }
    .shift-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .shift-row:last-child { border-bottom: none; }
    .shift-row label { font-weight: 600; min-width: 140px; flex: 1; }
    .time-inputs { display: flex; align-items: center; gap: 0.4rem; }
    .time-inputs input[type="time"] { padding: 0.4rem; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; }
    .save-bar { position: sticky; bottom: 0; background: #fff; padding: 0.8rem 0; border-top: 1px solid var(--border); margin-top: 1rem; display: flex; justify-content: flex-end; }
    .form-row { margin-bottom: 0.8rem; }
    .form-row label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div>
        <h1 id="company-name">Quick Scheduling</h1>
        <span class="user-chip" id="user-chip"></span>
        <div class="nav-links" style="margin-top:0.5rem">
          <a href="/home.html">Home</a>
          <a href="/team.html">Team members</a>
          <a href="/schedule.html">Schedule</a>
          <a href="/rotations.html">Shift patterns</a>
          <a href="/settings.html">Settings</a>
          <a href="/candidates.html" id="nav-candidates" class="hidden">Candidates</a>
        </div>
      </div>
      <button type="button" id="logout" class="btn-secondary">Log out</button>
    </div>

    <div id="page-error" class="alert alert-error hidden" role="alert"></div>
    <div id="page-success" class="alert alert-success hidden" role="status"></div>

    <div class="settings-card">
      <h3>Staffing targets</h3>
      <p style="color:#5c7185;margin-top:0">How many of each shift type you need each day. Used to highlight short-staffed days on the schedule.</p>
      <div id="targets-list"></div>
    </div>

    <div class="settings-card">
      <h3>Shift settings</h3>
      <p style="color:#5c7185;margin-top:0">Default start and end times for each shift type.</p>
      <div id="shifts-list"></div>
    </div>

    <div class="save-bar">
      <button type="button" id="save-btn">Save settings</button>
    </div>
  </div>

  <script>
    function $(id) { return document.getElementById(id); }
    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function api(path, opts) {
      opts = opts || {};
      opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      return fetch(path, opts).then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
      });
    }
    function pageError(m) { var e = $('page-error'); e.textContent = m; show(e); setTimeout(function(){hide(e);}, 6000); }
    function pageSuccess(m) { var e = $('page-success'); e.textContent = m; show(e); setTimeout(function(){hide(e);}, 4000); }

    var shiftTypes = [];
    var targets = [];

    function renderTargets() {
      var html = '';
      targets.forEach(function (t, i) {
        html += '<div class="target-row">' +
          '<span class="color-dot" style="background:' + esc(t.color) + '"></span>' +
          '<span class="target-name">' + esc(t.name) + '</span>' +
          '<div class="stepper">' +
            '<button type="button" data-i="' + i + '" data-d="-1">−</button>' +
            '<span id="count-' + i + '">' + t.targetCount + '</span>' +
            '<button type="button" data-i="' + i + '" data-d="1">+</button>' +
          '</div>' +
          '<span style="color:#5c7185;font-size:0.9rem">per day</span>' +
          '</div>';
      });
      $('targets-list').innerHTML = html;
      $('targets-list').querySelectorAll('.stepper button').forEach(function (b) {
        b.addEventListener('click', function () {
          var i = parseInt(b.getAttribute('data-i'));
          var d = parseInt(b.getAttribute('data-d'));
          targets[i].targetCount = Math.min(20, Math.max(0, targets[i].targetCount + d));
          $('count-' + i).textContent = targets[i].targetCount;
        });
      });
    }

    function renderShifts() {
      var html = '';
      shiftTypes.forEach(function (st, i) {
        html += '<div class="shift-row">' +
          '<span class="color-dot" style="background:' + esc(st.color) + '"></span>' +
          '<label>' + esc(st.name) + '</label>' +
          '<div class="time-inputs">' +
            '<input type="time" id="start-' + i + '" value="' + esc(st.startTime || '08:00') + '">' +
            '<span>to</span>' +
            '<input type="time" id="end-' + i + '" value="' + esc(st.endTime || '20:00') + '">' +
          '</div>' +
          '</div>';
      });
      $('shifts-list').innerHTML = html;
    }

    function loadAll() {
      return Promise.all([
        api('/api/auth/me'),
        api('/api/schedule/shift-types'),
        api('/api/schedule/staffing-targets'),
      ]).then(function (rs) {
        var me = rs[0];
        if (!me.ok) { window.location.href = '/login.html'; return; }
        var role = me.data.user.role;
        if (role !== 'owner' && role !== 'scheduler') { window.location.href = '/home.html'; return; }
        $('company-name').textContent = me.data.company.name;
        $('user-chip').textContent = me.data.user.name + ' (' + role + ')';
        show($('nav-candidates'));
        shiftTypes = rs[1].data.shiftTypes || [];
        targets = rs[2].data.targets || [];
        renderTargets();
        renderShifts();
      });
    }

    $('save-btn').addEventListener('click', function () {
      var targetPayload = targets.map(function (t) {
        return { shiftTypeId: t.shiftTypeId, targetCount: t.targetCount };
      });
      var shiftUpdates = shiftTypes.map(function (st, i) {
        return api('/api/schedule/shift-types/' + st.id, {
          method: 'PUT',
          body: JSON.stringify({
            startTime: $('start-' + i).value,
            endTime: $('end-' + i).value,
          }),
        });
      });
      Promise.all([
        api('/api/schedule/staffing-targets', { method: 'PUT', body: JSON.stringify({ targets: targetPayload }) }),
      ].concat(shiftUpdates)).then(function (rs) {
        var failed = rs.filter(function (r) { return !r.ok; });
        if (failed.length) {
          pageError('Some settings could not be saved. Please try again.');
        } else {
          pageSuccess('Settings saved.');
        }
        loadAll();
      });
    });

    $('logout').addEventListener('click', function () {
      api('/api/auth/logout', { method: 'POST' }).then(function () { window.location.href = '/login.html'; });
    });

    loadAll();
  </script>
</body>
</html>
