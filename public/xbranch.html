<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross-branch shift — Quick Scheduling</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f2f7f7; margin: 0; padding: 2rem 1rem; color: #123; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 1.6rem; box-shadow: 0 8px 30px rgba(8,63,77,.12); }
  h1 { font-size: 1.25rem; margin: 0 0 .4rem; color: #083f4d; }
  p { line-height: 1.5; }
  .big { font-size: 1.05rem; }
  .row { display: flex; gap: .6rem; margin-top: 1.2rem; }
  button { flex: 1; padding: .8rem; border-radius: 10px; border: 0; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .accept { background: #0e7c86; color: #fff; }
  .decline { background: #eef2f2; color: #37474a; }
  .msg { margin-top: 1rem; padding: .8rem 1rem; border-radius: 10px; display: none; }
  .ok { background: #e6f4ea; color: #14532d; }
  .err { background: #fdecec; color: #7f1d1d; }
  .dim { color: #607d8b; font-size: .9rem; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Cross-branch shift</h1>
  <p id="desc" class="big">Loading…</p>
  <p id="sub" class="dim"></p>
  <div class="row" id="actions" style="display:none">
    <button type="button" class="decline" id="btn-decline">Decline</button>
    <button type="button" class="accept" id="btn-accept">Accept</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var tok = params.get('token') || '';
  var desc = document.getElementById('desc');
  var sub = document.getElementById('sub');
  var actions = document.getElementById('actions');
  var msg = document.getElementById('msg');
  function showMsg(kind, text) {
    msg.className = 'msg ' + kind;
    msg.style.display = 'block';
    msg.textContent = text;
  }
  fetch('/api/institutions/assignments/act-info?' + new URLSearchParams({ token: tok }).toString())
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) { desc.textContent = (res.d && res.d.error) || 'This link is not valid.'; return; }
      var d = res.d;
      var when = d.date + (d.startTime ? ' · ' + d.startTime + '–' + (d.endTime || '') : '');
      desc.textContent = 'Hi ' + d.personName + ' — ' + d.hostBranch + ' is asking you to ' +
        (d.kind === 'cover' ? 'cover' : 'take') + ' a ' + d.shiftTypeName + ' shift.';
      sub.textContent = when + ' · ' + d.departmentName + ' (shared with your branch). Accepting first checks your shifts in BOTH branches, so you can never be double-booked.';
      if (d.status === 'pending') actions.style.display = 'flex';
      else sub.textContent += ' This request was already ' + d.status + '.';
    })
    .catch(function () { desc.textContent = 'Something went wrong loading this request.' });
  function act(decision) {
    document.getElementById('btn-accept').disabled = true;
    document.getElementById('btn-decline').disabled = true;
    fetch('/api/institutions/assignments/act', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: tok, decision: decision }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        actions.style.display = 'none';
        if (res.ok && res.d.status === 'confirmed') showMsg('ok', 'You\u2019re confirmed. The shift now shows on the other branch\u2019s schedule as covered by you.');
        else if (res.ok) showMsg('ok', 'Declined — thanks for answering.');
        else showMsg('err', (res.d && res.d.error) || 'Something went wrong.');
      })
      .catch(function () { showMsg('err', 'Something went wrong. Please try again.'); });
  }
  document.getElementById('btn-accept').addEventListener('click', function () { act('accept'); });
  document.getElementById('btn-decline').addEventListener('click', function () { act('decline'); });
})();
</script>
</body>
</html>
