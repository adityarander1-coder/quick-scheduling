<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule copy — History</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; margin: 0; padding: 24px 16px 48px; color: #101828; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .banner { background: #083f4d; color: #cfe3e6; padding: 14px 18px; font-size: 14px; border-radius: 12px 12px 0 0; }
  .banner b { color: #fff; }
  .banner .ro { display: block; font-size: 12px; color: #9fc3cb; margin-top: 3px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
  .days { padding: 14px 18px 18px; }
  .cday { margin-bottom: 16px; }
  .cday h4 { font-size: 13px; margin: 0 0 6px; color: #083f4d; }
  .crow { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; margin-bottom: 4px; background: #fbe3d3; }
  .crow.night { background: rgba(8,63,77,.10); }
  .crow.draft { background: #eef0f0; color: #6b7280; }
  .crow .t { color: #5b6b6f; font-weight: 600; width: 150px; flex: none; }
  .crow .dbadge { background: #6b7280; color: #fff; font-size: 9px; border-radius: 999px; padding: 2px 7px; }
  .crow.openrow { background: #f4f7f7; border: 1px dashed #9fb3b8; color: #5b6b6f; }
  .meta { font-size: 12px; color: #64748b; margin: 12px 2px 0; }
  .back { display: inline-block; margin-top: 16px; color: #0e7c86; font-size: 13px; font-weight: 700; text-decoration: none; }
  .err { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px 18px; text-align: center; color: #6b7280; font-size: 14px; }
  .err b { color: #101828; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="root"><div class="err"><b>Loading this copy…</b></div></div>
  <a class="back" href="/app.html#schedule">← Back to the live schedule</a>
</div>
<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtDay(s) { return parseDate(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function fmtWhen(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' +
      d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  function personName(s) {
    return s.nickname || ((s.firstName || '') + ' ' + (s.lastName || '')).trim() || '—';
  }
  var root = document.getElementById('root');
  var id = new URLSearchParams(location.search).get('id') || '';
  if (!id) {
    root.innerHTML = '<div class="err"><b>No copy selected.</b>Open a copy from History in the schedule app.</div>';
    return;
  }
  fetch('/api/schedule/history/' + encodeURIComponent(id), { headers: { 'Accept': 'application/json' } })
    .then(function (res) {
      if (res.status === 404) throw new Error('missing');
      if (!res.ok) throw new Error('load');
      return res.json();
    })
    .then(function (snap) {
      var d = snap.data || {};
      var shifts = d.shifts || [];
      var types = d.shiftTypes || [];
      var targets = d.targets || [];
      var closed = d.closedShifts || [];
      var extra = d.extraSlots || [];
      var draftOpens = d.draftOpenCounts || {};
      var notDrafted = d.notDraftedByType || {};
      function targetFor(date, typeId) {
        for (var i = 0; i < targets.length; i++) {
          var t = targets[i];
          if (t.shiftTypeId !== typeId) continue;
          var wd = t.weekdays || [0, 1, 2, 3, 4, 5, 6];
          if (wd.indexOf(parseDate(date).getDay()) < 0) return 0;
          if (t.startDate && date < t.startDate) return 0;
          if (t.endDate && date > t.endDate) return 0;
          return t.targetCount || 0;
        }
        return 0;
      }
      function openCount(date, typeId) {
        for (var i = 0; i < closed.length; i++) {
          if (closed[i].date === date && closed[i].shiftTypeId === typeId) return 0;
        }
        var notD = (notDrafted[typeId] || []).indexOf(date) !== -1;
        var target = notD ? 0 : targetFor(date, typeId);
        var ex = 0;
        for (var j = 0; j < extra.length; j++) {
          if (extra[j].date === date && extra[j].shiftTypeId === typeId) ex += (extra[j].count || 0);
        }
        if (!target && !ex) return 0;
        var filled = 0;
        for (var k = 0; k < shifts.length; k++) {
          if (shifts[k].date === date && shifts[k].shiftTypeId === typeId) filled++;
        }
        return Math.max(0, target + ex - filled);
      }
      // Dates in the copied window that have anything to show.
      var dates = {};
      shifts.forEach(function (s) { dates[s.date] = true; });
      // The window lives on the snapshot (snap.windowFrom/windowTo);
      // the frozen data carries the same range as d.from/d.to.
      var winFrom = snap.windowFrom || d.from;
      var winTo = snap.windowTo || d.to;
      types.forEach(function (st) {
        var cur = parseDate(winFrom);
        var end = parseDate(winTo);
        while (cur <= end) {
          var ds = cur.getFullYear() + '-' + String(cur.getMonth() + 1).padStart(2, '0') + '-' + String(cur.getDate()).padStart(2, '0');
          if (openCount(ds, st.id) > 0) dates[ds] = true;
          cur.setDate(cur.getDate() + 1);
        }
      });
      var dateList = Object.keys(dates).sort();
      var html = '<div class="card"><div class="banner"><b>Schedule copy — saved ' + esc(fmtWhen(snap.createdAt)) +
        (snap.createdByName ? ' by ' + esc(snap.createdByName) : '') + '</b>' +
        '<span class="ro">Read-only. This is a frozen copy from before &ldquo;' + esc(snap.summary || '') +
        '&rdquo;. Nothing here can be changed.</span></div><div class="days">';
      if (!dateList.length) {
        html += '<p style="color:#7a8a8e;font-size:13px">This copy has no shifts or open slots in its window.</p>';
      }
      dateList.forEach(function (date) {
        html += '<div class="cday"><h4>' + esc(fmtDay(date)) + '</h4>';
        types.forEach(function (st) {
          var rows = shifts.filter(function (s) { return s.date === date && s.shiftTypeId === st.id; });
          rows.forEach(function (s) {
            var isDraft = s.published === false;
            var night = /night/i.test(st.name || '');
            html += '<div class="crow' + (night ? ' night' : '') + (isDraft ? ' draft' : '') + '">' +
              '<span class="t">' + esc(st.name) + '</span>' + esc(personName(s)) +
              (isDraft ? ' <span class="dbadge">DRAFT</span>' : '') + '</div>';
          });
          var opens = openCount(date, st.id);
          if (opens > 0) {
            var draftN = draftOpens[date + '|' + st.id] || 0;
            var label = 'OPEN — ' + opens + ' slot' + (opens === 1 ? '' : 's');
            if (draftN > 0) label += draftN >= opens ? ' (draft)' : ' · ' + draftN + ' draft';
            html += '<div class="crow openrow"><span class="t">' + esc(st.name) + '</span>' + esc(label) + '</div>';
          }
        });
        html += '</div>';
      });
      html += '</div></div>';
      html += '<p class="meta">Copied window: ' + esc(fmtDay(snap.windowFrom)) + ' – ' + esc(fmtDay(snap.windowTo)) +
        ' · Saved ' + esc(fmtWhen(snap.createdAt)) + ' · Keeping the last 100 copies.</p>';
      root.innerHTML = html;
      document.title = 'Schedule copy — ' + fmtWhen(snap.createdAt);
    })
    .catch(function (err) {
      root.innerHTML = '<div class="err"><b>' + (err && err.message === 'missing'
        ? 'This copy is not available.'
        : 'Could not load this copy.') + '</b>' +
        (err && err.message === 'missing'
          ? 'It may have been pruned (only the last 100 copies are kept), or it belongs to a department you cannot see.'
          : 'Please sign in again and try the link once more.') + '</div>';
    });
})();
</script>
</body>
</html>
